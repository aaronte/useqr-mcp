name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check publish metadata
        run: |
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"
          test "$(jq -r .version package.json)" = "$(jq -r .version server.json)"
          test "$(jq -r .name package.json)" = "$(jq -r '.packages[0].identifier' server.json)"
          test "$(jq -r .version package.json)" = "$(jq -r '.packages[0].version' server.json)"
          test "$(jq -r '.packages[0].registryType' server.json)" = "npm"
          test "$(jq -r '.packages[0].transport.type' server.json)" = "stdio"
          test "$(jq -r '.remotes[0].url' server.json)" = "https://useqr.co/api/mcp"

      - name: Pack dry-run
        run: npm pack --dry-run
