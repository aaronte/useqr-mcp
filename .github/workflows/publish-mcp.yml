name: Publish to npm and MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check publish metadata
        run: |
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"
          test "$(jq -r .version package.json)" = "$(jq -r .version server.json)"
          test "$(jq -r .name package.json)" = "$(jq -r '.packages[0].identifier' server.json)"
          test "$(jq -r .version package.json)" = "$(jq -r '.packages[0].version' server.json)"

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(jq -r .version package.json)"
          if npm view "useqr-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "useqr-mcp@${VERSION} already on npm"
          else
            if [ -z "${NODE_AUTH_TOKEN}" ]; then
              echo "NPM_TOKEN is missing. Add an npm automation token as the NPM_TOKEN repository secret."
              exit 1
            fi
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
